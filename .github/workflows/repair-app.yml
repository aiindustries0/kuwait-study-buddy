name: Repair app.py

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore and repair app.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: 7b7b21175e497e1a2333634e6aa14ce847d30058
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          url = f"https://api.github.com/repos/{os.environ['REPO']}/contents/app.py?ref={os.environ['SOURCE_SHA']}"
          request = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          encoded = payload["content"]
          app = base64.b64decode(encoded)
          prefix = b"import json\nimport os\nimport sqlite3\nimport time\n"
          if not app.startswith(prefix):
              raise SystemExit("app.py does not start with the required imports")
          app = app.replace(b"gemini-2.0-flash", b"gemini-3.6-flash")
          with open("app.py", "wb") as file:
              file.write(app)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm .github/workflows/repair-app.yml
          git commit -m "fix: restore app.py from known-good commit and use gemini-3.6-flash"
          git push origin HEAD:main
