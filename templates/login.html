{% extends "base.html" %}{% block title %}Log in{% endblock %}{% block content %}<section class="auth-section page-section"><div class="auth-card"><div class="eyebrow"><span class="status-dot"></span> WELCOME BACK</div><h1>Pick up where you left off.</h1><p class="auth-copy">Your study space is ready when you are.</p><form class="form-card" method="post" novalidate><div class="form-heading"><span class="mono">ACCESS / 002</span><span class="form-signal"></span></div><div class="field-group"><label for="email">Email address</label><input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required autofocus></div><div class="field-group"><div class="label-row"><label for="password">Password</label><span class="field-hint">8+ characters</span></div><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="button button-primary button-full" type="submit">Log in</button><p class="form-footnote">New here? <a href="{{ url_for('signup') }}">Create an account</a></p></form></div></section>{% endblock %}
