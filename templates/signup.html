{% extends "base.html" %}{% block title %}Create your account{% endblock %}{% block content %}
<section class="auth-section page-section"><div class="auth-intro"><div class="eyebrow"><span class="status-dot"></span>START YOUR SIGNAL</div><h1>Your best study<br><em>starts here.</em></h1><p>Set up your private study space in less than a minute.</p></div><form class="form-card" method="post" novalidate><div class="form-heading"><span class="mono">NEW PROFILE / 001</span><span class="form-signal"></span></div><div class="field-group"><label for="name">Your name</label><input id="name" name="name" type="text" value="{{ name }}" autocomplete="name" maxlength="80" required autofocus></div><div class="field-group"><label for="email">Email address</label><input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" maxlength="254" required></div><div class="field-group"><div class="label-row"><label for="password">Password</label><span class="field-hint">8+ characters</span></div><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="field-group"><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required></div><button class="button button-primary button-full" type="submit">Create account <span>→</span></button><p class="form-footnote">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></form></section>
{% endblock %}
